name: CI/CD Release Pipeline

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
      - production
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: release-pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  IMAGE_REVISION: ${{ github.sha }}

jobs:
  validate:
    name: Validate Application and Runtime
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Node dependencies
        run: npm ci

      - name: Restore Auth Service
        run: dotnet restore services/auth-service/AuthService.sln

      - name: Restore Game Engine
        run: dotnet restore services/game-engine/GameEngine.sln

      - name: Restore extracted financial services
        run: |
          dotnet restore services/ledger-service/LedgerService.csproj
          dotnet restore services/credit-wallet-service/CreditWalletService.csproj
          dotnet restore services/settlement-service/SettlementService.csproj

      - name: npm lint
        run: npm run lint

      - name: npm build
        env:
        
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
        
        run: npm run build
      - name: Dependency audit
        run: npm run security:audit

      - name: Auth Service build/test
        run: |
          dotnet build services/auth-service/AuthService.sln --configuration Release --no-restore
          dotnet test services/auth-service/AuthService.sln --configuration Release --no-build

      - name: Game Engine build/test
        run: |
          dotnet build services/game-engine/GameEngine.sln --configuration Release --no-restore
          dotnet test services/game-engine/GameEngine.sln --configuration Release --no-build

      - name: Ledger Service build/test
        run: |
          dotnet build services/ledger-service/LedgerService.csproj --configuration Release --no-restore
          dotnet test services/ledger-service/LedgerService.csproj --configuration Release --no-build

      - name: Credit Wallet Service build/test
        run: |
          dotnet build services/credit-wallet-service/CreditWalletService.csproj --configuration Release --no-restore
          dotnet test services/credit-wallet-service/CreditWalletService.csproj --configuration Release --no-build

      - name: Settlement Service build/test
        run: |
          dotnet build services/settlement-service/SettlementService.csproj --configuration Release --no-restore
          dotnet test services/settlement-service/SettlementService.csproj --configuration Release --no-build

      - name: Compose validation
        run: |
          docker compose config
          docker compose -f docker-compose.production.yml config

      - name: Production runtime QA
        run: |
          npm run qa:production-config
          npm run qa:production-compose
          npm run qa:managed-services-wiring
          npm run qa:cicd-release-pipeline
          npm run qa:production-migration-governance
          npm run qa:observability-baseline
          npm run qa:production-runtime
          npm run qa:queue-operations
          npm run qa:container-network-hardening

      - name: Source container security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-source-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy source scan
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-source-results.sarif

      - name: Generate source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: lottery-app-source-sbom.spdx.json

  integration-validation:
    name: Canonical Integration Validation
    runs-on: ubuntu-latest
    needs: validate
    if: always()
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lottery
          POSTGRES_PASSWORD: lottery_ci_password
          POSTGRES_DB: lottery_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lottery -d lottery_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: lottery
          RABBITMQ_DEFAULT_PASS: lottery_ci_password
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CI: "true"
      DATABASE_URL: postgresql://lottery:lottery_ci_password@127.0.0.1:5432/lottery_disposable
      LOCAL_DATABASE_URL: postgresql://lottery:lottery_ci_password@127.0.0.1:5432/lottery_disposable
      ALLOW_DISPOSABLE_DB_MIGRATIONS: "true"
      RABBITMQ_URL: amqp://lottery:lottery_ci_password@127.0.0.1:5672
      RABBITMQ_HOST: 127.0.0.1
      RABBITMQ_PORT: "5672"
      RABBITMQ_MANAGEMENT_URL: http://127.0.0.1:15672
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      LOCAL_POSTGRES_HOST: 127.0.0.1
      LOCAL_POSTGRES_PORT: "5432"
      APP_URL: http://127.0.0.1:3000
      AUTH_SERVICE_URL: http://127.0.0.1:5600
      GAME_ENGINE_URL: http://127.0.0.1:5500
      LEDGER_SERVICE_URL: http://127.0.0.1:5200
      CREDIT_SERVICE_URL: http://127.0.0.1:5300
      SETTLEMENT_SERVICE_URL: http://127.0.0.1:5400
      INTEGRATION_EVIDENCE_DIR: ${{ runner.temp }}/mosera-integration-evidence
      AUTH_PROVIDER: auth-service
      AUTH_AUTHORITY: MONOLITH
      AUTH_ALLOW_INITIAL_BOOTSTRAP: "true"
      LEDGER_AUTHORITY: MONOLITH
      CREDIT_AUTHORITY: MONOLITH
      SETTLEMENT_AUTHORITY: MONOLITH
      CREDIT_WALLET_INTERNAL_AUTH_REQUIRED: "true"
      CREDIT_WALLET_INTERNAL_API_KEY: ci-credit-wallet-internal-key
      CREDIT_WALLET_INTERNAL_CALLERS: app,settlement-service
      ASPNETCORE_ENVIRONMENT: Production
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: https://ci-disposable.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-disposable-publishable-key
      SUPABASE_URL: https://ci-disposable.invalid
      SUPABASE_SERVICE_ROLE_KEY: ci-disposable-service-role-key
      SUPABASE_ANON_KEY: ci-disposable-anon-key
      RABBITMQ_DIAGNOSTIC_USER: lottery
      RABBITMQ_DIAGNOSTIC_PASSWORD: lottery_ci_password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize integration evidence
        run: |
          mkdir -p "${INTEGRATION_EVIDENCE_DIR}/status" "${INTEGRATION_EVIDENCE_DIR}/build"
          printf '%s\n' "workflow-setup" >"${INTEGRATION_EVIDENCE_DIR}/status/current-phase.txt"
          printf 'MIGRATIONS_POSTGRES_CONTAINER=%s\n' '${{ job.services.postgres.id }}' >>"${GITHUB_ENV}"

      - name: Require prerequisite validation
        if: needs.validate.result != 'success'
        run: |
          printf '%s\n' "prerequisite-validation" >"${INTEGRATION_EVIDENCE_DIR}/status/current-phase.txt"
          printf '%s\n' "FAIL" >"${INTEGRATION_EVIDENCE_DIR}/status/canonical-integration-validation.status"
          printf 'Validate Application and Runtime result: %s\n' "${{ needs.validate.result }}" >"${INTEGRATION_EVIDENCE_DIR}/build/prerequisite-validation.log"
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        run: |
          printf '%s\n' "dependency-install" >"${INTEGRATION_EVIDENCE_DIR}/status/current-phase.txt"
          npm ci > >(tee "${INTEGRATION_EVIDENCE_DIR}/build/npm-ci.log") 2>&1

      - name: Build runtime
        run: |
          printf '%s\n' "runtime-build" >"${INTEGRATION_EVIDENCE_DIR}/status/current-phase.txt"
          {
            npm run build
            dotnet restore services/auth-service/AuthService.sln
            dotnet build services/auth-service/AuthService.sln --configuration Release --no-restore
            dotnet restore services/game-engine/GameEngine.sln
            dotnet build services/game-engine/GameEngine.sln --configuration Release --no-restore
            dotnet restore services/ledger-service/LedgerService.csproj
            dotnet build services/ledger-service/LedgerService.csproj --configuration Release --no-restore
            dotnet restore services/credit-wallet-service/CreditWalletService.csproj
            dotnet build services/credit-wallet-service/CreditWalletService.csproj --configuration Release --no-restore
            dotnet restore services/settlement-service/SettlementService.csproj
            dotnet build services/settlement-service/SettlementService.csproj --configuration Release --no-restore
          } > >(tee "${INTEGRATION_EVIDENCE_DIR}/build/runtime-build.log") 2>&1

      - name: Run canonical integration QA
        id: canonical-integration
        run: bash scripts/ci/run-integration-validation.sh

      - name: Collect integration diagnostics
        if: always()
        continue-on-error: true
        run: bash scripts/ci/collect-integration-evidence.sh

      - name: Sanitize integration evidence
        if: always()
        continue-on-error: true
        run: node scripts/ci/sanitize-integration-evidence.mjs

      - name: Upload canonical integration evidence
        id: integration-evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-integration-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.INTEGRATION_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
          include-hidden-files: true

      - name: Publish canonical integration summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.integration-evidence.outputs.artifact-url }}
          CANONICAL_STEP_OUTCOME: ${{ steps.canonical-integration.outcome }}
        run: |
          if [ -f "${INTEGRATION_EVIDENCE_DIR}/summary/job-summary.md" ]; then
            cat "${INTEGRATION_EVIDENCE_DIR}/summary/job-summary.md" >>"${GITHUB_STEP_SUMMARY}"
          else
            printf '# Canonical Integration Validation\n\nDiagnostic collection did not produce a summary.\n' >>"${GITHUB_STEP_SUMMARY}"
          fi
          printf '\n## Evidence\n\n' >>"${GITHUB_STEP_SUMMARY}"
          printf -- '- Canonical QA step outcome: `%s`\n' "${CANONICAL_STEP_OUTCOME:-not-run}" >>"${GITHUB_STEP_SUMMARY}"
          if [ -n "${ARTIFACT_URL:-}" ]; then
            printf -- '- [Download canonical integration evidence](%s)\n' "${ARTIFACT_URL}" >>"${GITHUB_STEP_SUMMARY}"
          else
            printf -- '- Artifact upload did not return a URL; inspect the upload step.\n' >>"${GITHUB_STEP_SUMMARY}"
          fi

  build-images:
    name: Build and Publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs:
      - validate
      - integration-validation

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: app
            image: lottery-app
            context: .
            dockerfile: Dockerfile
          - service: auth-service
            image: auth-service
            context: services/auth-service
            dockerfile: services/auth-service/Dockerfile
          - service: game-engine
            image: game-engine
            context: services/game-engine
            dockerfile: services/game-engine/Dockerfile
          - service: ledger-service
            image: ledger-service
            context: services/ledger-service
            dockerfile: services/ledger-service/Dockerfile
          - service: credit-wallet-service
            image: credit-wallet-service
            context: services/credit-wallet-service
            dockerfile: services/credit-wallet-service/Dockerfile
          - service: settlement-service
            image: settlement-service
            context: services/settlement-service
            dockerfile: services/settlement-service/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request' && (github.ref_protected || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.service.name=${{ matrix.service }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' && (github.ref_protected || startsWith(github.ref, 'refs/tags/v')) }}
          load: ${{ !(github.event_name != 'pull_request' && (github.ref_protected || startsWith(github.ref, 'refs/tags/v'))) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://ci-build.lotteryplatform.invalid
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=ci-build-publishable-key

      - name: Container image scan
        if: github.event_name == 'pull_request' || !(github.ref_protected || startsWith(github.ref, 'refs/tags/v'))
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:sha-${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate image SBOM
        if: github.event_name == 'pull_request' || !(github.ref_protected || startsWith(github.ref, 'refs/tags/v'))
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:sha-${{ github.sha }}
          format: spdx-json
          artifact-name: ${{ matrix.image }}-image-sbom.spdx.json
